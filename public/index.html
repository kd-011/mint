<body>
<div id="lock" class="lock" data-state="checking" role="dialog" aria-modal="true" aria-labelledby="lock-t" aria-describedby="lock-line">
  <div class="lock-card">
    <div class="lock-mark" aria-hidden="true">
      <span class="lock-ring"></span>
      <svg class="lock-fp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
      <svg class="lock-tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 id="lock-t" class="lock-t">Mint</h1>
    <p id="lock-line" class="lock-line" role="status" aria-live="polite">Checking the lock...</p>
    <div id="lock-err" class="error compact lock-err" role="alert" hidden><div class="h"></div><div class="d"></div></div>
    <button id="lock-go" class="btn lock-go" type="button" aria-busy="false" hidden><span class="spin" aria-hidden="true"></span><svg class="lock-go-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg><span id="lock-go-l">Unlock with fingerprint</span></button>
    <p class="lock-foot">Signed in through your login gateway. Your fingerprint is the second key, asked each time Mint opens.</p>
  </div>
</div>
<a class="skip" href="#view">Skip to content</a>
<div id="loadbar" aria-hidden="true"><i></i></div>
<div id="offline" class="banner" hidden>Offline. Showing saved data; changes sync when you are back.</div>
<div id="shell">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="view" tabindex="-1"></main>
  <aside id="pane" aria-label="Details"></aside>
</div>
<div id="sheet" hidden><div class="scrim"></div><section class="panel" role="dialog" aria-modal="true" tabindex="-1"></section></div>
<div id="modal" hidden><div class="scrim"></div><section class="panel" role="dialog" aria-modal="true" tabindex="-1"></section></div>
<div id="palette" hidden>
  <div class="scrim"></div>
  <section class="panel" role="dialog" aria-modal="true" aria-label="Search Mint">
    <div class="pal-top">
      <label class="search"><span class="si" aria-hidden="true"></span><input id="palq" type="search" role="combobox" aria-expanded="true" aria-controls="pallist" aria-autocomplete="list" placeholder="Search merchants, amounts, screens" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search Mint"><button type="button" id="palx" aria-label="Clear search" title="Clear search" hidden></button></label>
      <button class="x" type="button" id="palclose" data-close aria-label="Close search" title="Close (Esc)"></button>
    </div>
    <div id="pallist" class="pal-list" role="listbox" aria-label="Results"></div>
    <div class="pal-foot" aria-hidden="true"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </section>
</div>
<div id="toasts" aria-live="polite"></div>
<noscript>Mint needs JavaScript.</noscript>
</body>
</html>
