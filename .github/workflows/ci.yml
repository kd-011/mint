name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Exports land as pushes, but weeks can pass between them: this keeps the badge honest.
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # the backup tests drive the real age and age-keygen binaries
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Syntax check
        run: node --check *.mjs lib/*.mjs scripts/*.mjs
      - name: Tests
        run: node --test test/
      - name: Secret and personal data scan
        run: node scripts/secret-scan.mjs . --tracked
