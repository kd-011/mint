# Publishes the container image and cuts the GitHub Release when CHANGELOG.md gains a new version.
#
# To release: add a "## [x.y.z] - YYYY-MM-DD" section to CHANGELOG.md and let the export push it to main.
# This compares that version with the tags. If it is new, it runs the tests, proves the image serves the
# demo, pushes ghcr.io/kd-011/mint for amd64 and arm64, then makes the tag and the release from that section.
# Re-running a failed run (or Actions > release > Run workflow) finishes what is left.
#
# Only the token every run already has. GitHub makes a new package private on its first publish, so after the
# very first push someone has to set it public once: the package's settings, under Danger Zone. Until then
# `docker compose up` falls back to building from source, so nothing a reader follows breaks.
name: release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: What is left to release
        id: plan
        run: |
          v="$(node scripts/release-plan.mjs version)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ] && [ -z "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$v" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v$v is already tagged, nothing to release"
          fi
      # the backup tests drive the real age and age-keygen binaries
      - name: Install age
        if: steps.plan.outputs.new == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Tests
        if: steps.plan.outputs.new == 'true'
        run: node --test test/
      - name: The image serves the demo
        if: steps.plan.outputs.new == 'true'
        run: |
          docker build -t mint-smoke .
          docker run -d --name smoke -p 127.0.0.1:8980:8980 -e MINT_PORT=8980 -e MINT_DEMO_HOST=0.0.0.0 mint-smoke node scripts/demo-seed.mjs 8980
          for i in $(seq 1 60); do
            docker logs smoke 2>&1 | grep -q 'ready: open' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8980/api/networth | grep -q net_worth
          docker rm -f smoke
      - uses: docker/setup-qemu-action@v4
        if: steps.plan.outputs.new == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.plan.outputs.new == 'true'
      - uses: docker/login-action@v4
        if: steps.plan.outputs.new == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.plan.outputs.new == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/kd-011/mint:${{ steps.plan.outputs.version }}
            ghcr.io/kd-011/mint:latest
      - name: Tag and release
        if: steps.plan.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node scripts/release-plan.mjs notes "$VERSION" > notes.md
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Mint v$VERSION" --notes-file notes.md
          fi
